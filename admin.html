<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة إدارة مكتبة الريحانة</title><link rel="stylesheet" href="style.css"><style>body{background:#f0f2f8}.panel{max-width:900px;margin:35px auto;padding:25px}.box{background:#fff;padding:20px;border-radius:18px;margin:15px 0;border:1px solid #e1e5ef}.box input,.box textarea{width:100%;padding:11px;margin:6px 0;border:1px solid #d7dce8;border-radius:10px;font:inherit}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.item{display:flex;gap:8px;align-items:center;margin:8px 0}.item input{margin:0}.save{background:#15935a}.reset{background:#d6284f}.note{color:#68738e}@media(max-width:650px){.row{grid-template-columns:1fr}}</style></head><body><header><a class="brand" href="index.html"><span>🌸</span><b>مكتبة الريحانة</b></a><nav><a href="index.html">عرض الموقع</a></nav></header><main class="panel"><h1>لوحة إدارة مكتبة الريحانة</h1><p class="note">هذه النسخة تحفظ إعدادات الموقع داخل المتصفح. للنشر الحقيقي مع دخول آمن وقاعدة بيانات نحتاج ربطها بخادم/قاعدة بيانات.</p><div class="box"><h2>بيانات الموقع</h2><input id="title" placeholder="اسم المكتبة"><input id="heroTitle" placeholder="العنوان الرئيسي"><textarea id="heroText" rows="3" placeholder="وصف الموقع"></textarea><div class="row"><input id="phone" placeholder="رقم الهاتف"><input id="address" placeholder="العنوان"><input id="hours" placeholder="أوقات الدوام"></div></div><div class="box"><h2>الخدمات</h2><div id="services"></div><button class="btn" onclick="addService()">+ إضافة خدمة</button></div><div class="box"><h2>المنتجات</h2><div id="products"></div><button class="btn" onclick="addProduct()">+ إضافة منتج</button></div><button class="btn save" onclick="save()">حفظ التغييرات</button> <button class="btn reset" onclick="resetData()">إعادة الإعدادات الافتراضية</button><p id="status"></p></main><script src="admin.js"></script></body></html>
